name: deploy dev
on:
  push:
    branches:
      - 'dev'

jobs:
  deploy-test:
    name: ${{ matrix.step }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      YARN_ENABLE_SCRIPTS: false
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_RELEASE_GITHUB_API_TOKEN: ${{ secrets.GH_PAT }}
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Configure npm registry
        run: |
          npm config set registry https://registry.npmmirror.com
          yarn config set registry https://registry.npmmirror.com

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: install deps
        run: |
          yarn install --frozen-lockfile --prefer-offline --network-timeout 100000 --network-concurrency 1

      - name: Clean build cache
        run: |
          rm -rf node_modules/.vite
          rm -rf dist

      - name: build
        run: |
          yarn build:test

      - name: deploy test
        uses: appleboy/scp-action@master
        with:
          username: ubuntu
          host: ${{ secrets.HOST }}
          port: 22
          key: ${{ secrets.KEY }}
          source: ${{ github.workspace }}/dist
          target: '/home/ubuntu/dev-web-wallet'
          strip_components: 6
          rm: true

      # 验证部署结果
      - name: Verify deployment structure
        uses: appleboy/ssh-action@master
        with:
          username: ubuntu
          host: ${{ secrets.HOST }}
          key: ${{ secrets.KEY }}
          script: |
            echo "🔍 === 部署验证开始 ==="
            echo ""

            echo "📁 === 目标目录结构 ==="
            ls -la /home/ubuntu/dev-web-wallet/
            echo ""

            echo "📄 === index.html 内容预览 ==="
            if [ -f "/home/ubuntu/dev-web-wallet/index.html" ]; then
              head -5 /home/ubuntu/dev-web-wallet/index.html
            else
              echo "❌ index.html 文件不存在！"
            fi
            echo ""

            echo "📦 === assets 目录内容 ==="
            if [ -d "/home/ubuntu/dev-web-wallet/assets" ]; then
              ls -la /home/ubuntu/dev-web-wallet/assets/
            else
              echo "❌ assets 目录不存在！"
            fi
            echo ""

            echo "🌳 === 完整目录树结构 ==="
            tree /home/ubuntu/dev-web-wallet/ || find /home/ubuntu/dev-web-wallet/ -type f | sort
            echo ""

            echo "✅ === 部署验证完成 ==="
